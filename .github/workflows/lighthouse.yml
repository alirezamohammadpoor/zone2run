name: Lighthouse budget
# Runs against every successful Vercel preview deployment and fails the
# check when a template breaks its performance budget (lighthouserc.json).
# LCP target is 2.5s. PLP (/mens/clothing), collection, search and blog post
# measured 2.95s / 2.52s / 3.37s / 3.10s in the first runs, so they sit on a 3.6s ratchet that
# still catches regressions; drop them to 2500 once
# server pagination and LCP image priority land.
on:
  deployment_status:

jobs:
  lighthouse:
    name: Lighthouse CI
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'
    # ubuntu-latest can't install browsers reliably right now (see #192)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Build URL list
        id: urls
        env:
          BASE: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          {
            echo "list<<EOF"
            jq -r --arg base "${BASE%/}" '.paths[] | $base + .' lighthouse-paths.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Write bypass header
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          jq --arg b "$BYPASS" '.ci.collect.settings.extraHeaders = ({"x-vercel-protection-bypass": $b} | tostring)' lighthouserc.json > lighthouserc.ci.json
      - uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: ./lighthouserc.ci.json
          uploadArtifacts: true
          temporaryPublicStorage: false
